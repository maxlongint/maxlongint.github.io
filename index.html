<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <!-- 预加载关键资源 - 移除 logo.png 预加载，改为懒加载 -->
        <!-- 预加载关键 CSS -->
        <link rel="preload" href="/src/index.css" as="style" />

        <!-- 字体优化：使用系统字体，无需额外加载 -->
        <style>
            /* 预设字体，减少 FOUT (Flash of Unstyled Text) */
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
        </style>

        <!-- DNS 预解析和预连接 - 仅保留关键第三方服务 -->
        <link rel="dns-prefetch" href="https://github.com" />
        <link rel="preconnect" href="https://github.com" crossorigin />
        <link rel="dns-prefetch" href="https://img.shields.io" />
        <!-- Clarity 延迟加载，不需要预连接 -->

        <meta
            name="description"
            content="精心整理的前端开发工具与资源,让你的开发更高效。包含JavaScript库、TypeScript工具、图标资源、动画库等优秀的Web开发资源。"
        />
        <meta
            name="keywords"
            content="前端开发,JavaScript,TypeScript,网页开发,开发工具,Web开发,编程资源,前端库,代码工具"
        />
        <meta name="author" content="Cyclone77" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="前端工具库" />
        <meta property="og:description" content="精心整理的前端开发工具与资源,让你的开发更高效" />
        <meta property="og:image" content="/og-images/default.png" />
        <meta property="og:site_name" content="前端工具库" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="前端工具库" />
        <meta name="twitter:description" content="精心整理的前端开发工具与资源,让你的开发更高效" />
        <meta name="twitter:image" content="/og-images/default.png" />

        <title>前端工具库</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
