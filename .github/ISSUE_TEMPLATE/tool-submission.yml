name: 🚀 工具收录申请
description: 提交一个新的前端工具/资源到工具库
title: '[收录] '
labels: ['收录申请', '待审核']
assignees: []

body:
    - type: markdown
      attributes:
          value: |
              感谢您提交工具收录申请！请填写以下信息以便我们审核。

    - type: input
      id: tool-name
      attributes:
          label: 工具名称
          description: 工具的名称
          placeholder: 例如：React Query
      validations:
          required: true

    - type: input
      id: github-url
      attributes:
          label: GitHub 仓库地址
          description: 工具的 GitHub 仓库链接
          placeholder: https://github.com/username/repo
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: 工具描述
          description: 简要描述这个工具的功能和特点（50-200字）
          placeholder: 请用简洁的语言描述工具的核心功能...
      validations:
          required: true

    - type: input
      id: tags
      attributes:
          label: 标签
          description: |
              为工具添加标签，用逗号分隔。请从以下分类中选择合适的标签：
              
              **核心功能**: 状态管理、数据校验、动画效果、图表可视化、流程图、富文本编辑、代码编辑、终端模拟、视频播放、音频处理、图片处理、图片生成、文件上传、文件解析、文件检测、拖拽排序、滚动交互、手势识别、网络请求、实时协作、日期时间、数学计算、公式渲染、国际化、安全防护、本地存储、剪贴板、快捷键、用户引导
              
              **UI组件**: 图标库、颜色选择、轮播组件、日历组件、提示组件、签名组件、虚拟键盘、加载动画、JSON编辑
              
              **工具类**: 工具函数、唯一标识、模糊搜索、模拟数据、编码转换、DOM操作、演示文稿
              
              **样式类**: CSS框架、CSS重置
              
              如果没有合适的标签，可以填写新标签，我们会在审核时添加。
          placeholder: 例如：数据校验, 工具函数
      validations:
          required: true

    - type: checkboxes
      id: terms
      attributes:
          label: 确认事项
          description: 请确认以下事项
          options:
              - label: 我确认这个工具是开源的
                required: true
              - label: 我确认这个工具适合前端开发者使用
                required: true
              - label: 我已阅读并同意提交规则
                required: true

    - type: markdown
      attributes:
          value: |
              ---
              ### 📝 审核说明

              - 我们会在 1-3 个工作日内审核您的提交
              - 审核通过后，工具将自动添加到工具库
              - 如有任何问题，我们会在 Issue 中回复

              感谢您为前端社区做出的贡献！🎉
