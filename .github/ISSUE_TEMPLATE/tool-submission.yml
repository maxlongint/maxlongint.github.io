name: 🚀 工具收录申请
description: 提交一个新的前端工具/资源到工具库
title: '[收录] '
labels: ['收录申请', '待审核']
assignees: []

body:
    - type: markdown
      attributes:
          value: |
              感谢您提交工具收录申请！请填写以下信息以便我们审核。

    - type: input
      id: tool-name
      attributes:
          label: 工具名称
          description: 工具的名称
          placeholder: 例如：React Query
      validations:
          required: true

    - type: input
      id: github-url
      attributes:
          label: GitHub 仓库地址
          description: 工具的 GitHub 仓库链接
          placeholder: https://github.com/username/repo
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: 工具描述
          description: 简要描述这个工具的功能和特点（50-200字）
          placeholder: 请用简洁的语言描述工具的核心功能...
      validations:
          required: true

    - type: input
      id: tags
      attributes:
          label: 标签
          description: 为工具添加标签，用逗号分隔（例如：TypeScript,数据验证,性能优化）
          placeholder: TypeScript, 数据验证
      validations:
          required: true

    - type: checkboxes
      id: terms
      attributes:
          label: 确认事项
          description: 请确认以下事项
          options:
              - label: 我确认这个工具是开源的
                required: true
              - label: 我确认这个工具适合前端开发者使用
                required: true
              - label: 我已阅读并同意提交规则
                required: true

    - type: markdown
      attributes:
          value: |
              ---
              ### 📝 审核说明

              - 我们会在 1-3 个工作日内审核您的提交
              - 审核通过后，工具将自动添加到工具库
              - 如有任何问题，我们会在 Issue 中回复

              感谢您为前端社区做出的贡献！🎉
