name: Test Label Trigger

on:
    issues:
        types: [labeled]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Print Event Info
              run: |
                  echo "Event name: ${{ github.event_name }}"
                  echo "Action: ${{ github.event.action }}"
                  echo "Issue number: ${{ github.event.issue.number }}"
                  echo "Issue title: ${{ github.event.issue.title }}"
                  echo "All labels:"
                  echo '${{ toJSON(github.event.issue.labels) }}'
                  echo ""
                  echo "Checking for specific labels:"
                  echo "Has '收录通过': ${{ contains(github.event.issue.labels.*.name, '收录通过') }}"
                  echo "Has 'approved': ${{ contains(github.event.issue.labels.*.name, 'approved') }}"
