name: Deploy to GitHub Pages

on:
    # 每天自动运行一次（UTC时间0点，北京时间8点）
    schedule:
        - cron: '0 0 * * *'
    # 推送到main分支时运行
    push:
        branches:
            - main
    # 允许手动触发
    workflow_dispatch:

# 设置权限
permissions:
    contents: read
    pages: write
    id-token: write

# 只允许一个部署任务同时运行
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Update GitHub Data
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/update-github-data.js

            - name: Build
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
