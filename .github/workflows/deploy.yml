name: Deploy to GitHub Pages

on:
    # 推送到master分支时运行
    push:
        branches:
            - master
    # 允许手动触发
    workflow_dispatch:
    # 数据更新后自动触发
    repository_dispatch:
        types: [deploy-requested]

# 设置权限
permissions:
    contents: read
    pages: write
    id-token: write

# 只允许一个部署任务同时运行
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Download data artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
              continue-on-error: true

            - name: Copy data files to public directory
              run: |
                  # 确保 public 目录存在
                  mkdir -p public

                  # 复制最新的数据文件
                  echo "📦 Checking for data artifacts..."

                  if [ -f "artifacts/github-stats/github-stats.json" ]; then
                    cp artifacts/github-stats/github-stats.json public/
                    echo "✅ Copied github-stats.json"
                  else
                    echo "⚠️ No github-stats.json artifact found"
                  fi

                  if [ -f "artifacts/github-readmes/github-readmes.json" ]; then
                    cp artifacts/github-readmes/github-readmes.json public/
                    echo "✅ Copied github-readmes.json"
                  else
                    echo "⚠️ No github-readmes.json artifact found"
                  fi

                  if [ -f "artifacts/trending/trending.json" ]; then
                    cp artifacts/trending/trending.json public/
                    echo "✅ Copied trending.json"
                  else
                    echo "⚠️ No trending.json artifact found"
                  fi

            - name: Build
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
