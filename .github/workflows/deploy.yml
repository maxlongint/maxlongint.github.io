name: Deploy to GitHub Pages

on:
    # 推送到master分支时运行
    push:
        branches:
            - master
    # 允许手动触发
    workflow_dispatch:

# 设置权限
permissions:
    contents: read
    pages: write
    id-token: write

# 只允许一个部署任务同时运行
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Copy data files to public directory
              run: |
                  # 确保 public 目录存在
                  mkdir -p public
                  # 如果 master 分支上有数据文件，就使用它们
                  # 否则 Vite 会使用预设数据
                  echo "ℹ️ Checking for data files in repository..."
                  if [ -f "public/github-stats.json" ]; then
                    echo "✅ Found github-stats.json"
                  else
                    echo "⚠️ No github-stats.json found, will use preset data"
                  fi

            - name: Build
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
