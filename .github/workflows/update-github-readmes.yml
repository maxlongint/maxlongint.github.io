name: Update GitHub READMEs

on:
    # 每天凌晨 2:00 北京时间 (UTC时间前一天 18:00)
    schedule:
        - cron: '0 18 * * *'
    # 允许手动触发
    workflow_dispatch:

jobs:
    update-readmes:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Update GitHub READMEs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/update-github-readmes.js

            - name: Upload readmes data as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: github-readmes
                  path: public/github-readmes.json
                  retention-days: 7

            - name: Trigger deployment
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  event-type: deploy-requested
                  client-payload: '{"reason": "github-readmes updated"}'
