name: Update Daily Trending

on:
    schedule:
        # 每天凌晨 3:00 北京时间 (UTC时间前一天 19:00)
        - cron: '0 19 * * *'
    workflow_dispatch: # 允许手动触发

jobs:
    update-trending:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Fetch trending data
              run: npm run fetch-trending

            - name: Commit and push changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  # 检查文件是否存在
                  if [ -f "public/trending.json" ]; then
                    echo "✅ File exists: public/trending.json"
                    ls -lh public/trending.json
                  else
                    echo "❌ File not found: public/trending.json"
                    exit 1
                  fi

                  # 强制添加文件
                  git add -f public/trending.json

                  # 检查是否有变化
                  if git diff --staged --quiet; then
                    echo "⚠️ No changes to commit"
                    exit 0
                  else
                    echo "✅ Changes detected, committing..."
                    git commit -m "🔄 Update daily trending data [skip ci]"
                    git push
                  fi
