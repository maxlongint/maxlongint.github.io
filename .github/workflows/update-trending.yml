name: Update Daily Trending

on:
    schedule:
        # 每天凌晨 3:00 北京时间 (UTC时间前一天 19:00)
        - cron: '0 19 * * *'
    workflow_dispatch: # 允许手动触发

jobs:
    update-trending:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Fetch trending data
              run: npm run fetch-trending

            - name: Upload trending data as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: trending
                  path: public/trending.json
                  retention-days: 7

            - name: Trigger deployment
              run: |
                  echo "✅ Trending data uploaded, deployment will be triggered"
