name: Update Daily Trending

on:
    schedule:
        # 每天凌晨 3:00 北京时间 (UTC时间前一天 19:00)
        - cron: '0 19 * * *'
    workflow_dispatch: # 允许手动触发

jobs:
    update-trending:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Fetch trending data
              run: npm run fetch-trending

            - name: Commit and push changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  git add src/data/trending.json

                  if git diff --staged --quiet; then
                    echo "⚠️ No changes to commit"
                  else
                    echo "✅ Committing updated trending data"
                    git commit -m "🔄 Update daily trending data"
                    git push
                  fi
