name: Update GitHub Stats

on:
    # 每天凌晨 1:00 北京时间 (UTC时间前一天 17:00)
    schedule:
        - cron: '0 17 * * *'
    # 允许手动触发
    workflow_dispatch:

jobs:
    update-stats:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Update GitHub Stats
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/update-github-stats.js

            - name: Commit and push changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  
                  # 检查文件是否存在
                  if [ -f "public/github-stats.json" ]; then
                    echo "✅ File exists: public/github-stats.json"
                    ls -lh public/github-stats.json
                  else
                    echo "❌ File not found: public/github-stats.json"
                    exit 1
                  fi
                  
                  # 检查 git 状态
                  echo "Git status before add:"
                  git status
                  
                  # 强制添加文件
                  git add -f public/github-stats.json
                  
                  # 检查暂存区
                  echo "Git status after add:"
                  git status
                  
                  # 检查是否有变化
                  if git diff --staged --quiet; then
                    echo "⚠️ No changes to commit"
                    exit 0
                  else
                    echo "✅ Changes detected, committing..."
                    git commit -m "🔄 Update GitHub stats data [skip ci]"
                    git push
                  fi
