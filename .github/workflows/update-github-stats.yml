name: Update GitHub Stats

on:
    # 每天凌晨 1:00 北京时间 (UTC时间前一天 17:00)
    schedule:
        - cron: '0 17 * * *'
    # 允许手动触发
    workflow_dispatch:

jobs:
    update-stats:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Update GitHub Stats
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/update-github-stats.js

            - name: Upload stats data as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: github-stats
                  path: public/github-stats.json
                  retention-days: 7

            - name: Trigger deployment
              run: |
                  echo "✅ Stats data uploaded, deployment will be triggered"
