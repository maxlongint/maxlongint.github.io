name: 🔄 Update Comparison Data

on:
    # 每天凌晨 1:30 北京时间 (UTC时间前一天 17:30)
    schedule:
        - cron: '30 17 * * *'
    # 允许手动触发
    workflow_dispatch:

jobs:
    update-comparison:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Update Comparison Data
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/update-comparison-data.js

            - name: Commit and push changes
              id: commit
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  git add src/data/comparison-data.json

                  if git diff --staged --quiet; then
                    echo "⚠️ No changes to commit"
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                  else
                    echo "✅ Committing updated comparison data"
                    git commit -m "🔄 Update comparison data"
                    git push
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                  fi

            - name: Trigger deployment
              if: steps.commit.outputs.has_changes == 'true'
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  event-type: deploy-requested
                  client-payload: '{"reason": "Comparison data updated"}'
