name: Auto Merge Submission

on:
  issues:
    types: [labeled]

jobs:
  merge-submission:
    # 只在 Issue 被标记为 "收录通过" 或 "approved" 时运行
    if: contains(github.event.issue.labels.*.name, '收录通过') || contains(github.event.issue.labels.*.name, 'approved')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Parse Issue and Update Bookmarks
        id: parse-issue
        run: |
          # 获取 Issue 内容
          ISSUE_BODY=$(cat <<'EOF'
          ${{ github.event.issue.body }}
          EOF
          )
          
          # 创建解析脚本
          cat > parse-issue.js << 'SCRIPT_END'
          const fs = require('fs');
          const issueBody = process.env.ISSUE_BODY;
          
          // 解析函数
          function parseIssueBody(body) {
            const result = {
              toolName: '',
              githubUrl: '',
              description: '',
              websiteUrl: '',
              category: '',
              tags: [],
            };
            
            // 提取工具名称
            const nameMatch = body.match(/(?:Tool Name|工具名称)[:\s*]+(.+)/i);
            if (nameMatch) {
              result.toolName = nameMatch[1].trim().replace(/^\*\*|\*\*$/g, '');
            }
            
            // 提取 GitHub URL
            const githubMatch = body.match(/(?:GitHub Repository|GitHub 仓库地址)[:\s*]+(.+)/i);
            if (githubMatch) {
              result.githubUrl = githubMatch[1].trim().replace(/^\*\*|\*\*$/g, '');
              // 确保是完整的URL
              if (!result.githubUrl.startsWith('http')) {
                result.githubUrl = 'https://' + result.githubUrl;
              }
            }
            
            // 提取官网URL
            const websiteMatch = body.match(/(?:Website\/Documentation|Website \/ Documentation URL|官网\/文档地址)[:\s*]+(.+)/i);
            if (websiteMatch) {
              const url = websiteMatch[1].trim().replace(/^\*\*|\*\*$/g, '');
              if (url !== 'N/A' && url !== '') {
                result.websiteUrl = url;
              }
            }
            
            // 提取描述 - 改进的正则表达式
            const descMatch = body.match(/###\s*Description\s*\n+([\s\S]+?)(?=\n###|$)/i);
            if (descMatch) {
              result.description = descMatch[1].trim();
            }
            
            // 提取分类
            const categoryMatch = body.match(/(?:Category|分类)[:\s*]+(.+)/i);
            if (categoryMatch) {
              result.category = categoryMatch[1].trim().replace(/^\*\*|\*\*$/g, '');
            }
            
            // 提取标签
            const tagsMatch = body.match(/(?:Tags|标签)[:\s*]+(.+)/i);
            if (tagsMatch) {
              const tagsStr = tagsMatch[1].trim().replace(/^\*\*|\*\*$/g, '');
              result.tags = tagsStr.split(/[,，]/).map(tag => tag.trim()).filter(tag => tag);
            }
            
            return result;
          }
          
          // 解析 Issue
          const parsed = parseIssueBody(issueBody);
          
          // 验证必填字段
          if (!parsed.toolName || !parsed.githubUrl || !parsed.description) {
            console.error('❌ 缺少必填字段');
            console.error('Tool Name:', parsed.toolName);
            console.error('GitHub URL:', parsed.githubUrl);
            console.error('Description:', parsed.description);
            process.exit(1);
          }
          
          // 读取现有的 bookmarks.json
          const bookmarksPath = './src/data/bookmarks.json';
          const bookmarksData = JSON.parse(fs.readFileSync(bookmarksPath, 'utf8'));
          
          // 检查是否已存在（通过 URL 判断）
          const exists = bookmarksData.bookmarks.some(
            bookmark => bookmark.url === parsed.githubUrl
          );
          
          if (exists) {
            console.log('⚠️  该工具已存在于列表中');
            process.exit(0);
          }
          
          // 创建新的 bookmark 对象
          const newBookmark = {
            title: parsed.toolName,
            url: parsed.githubUrl,
            description: parsed.description,
            tags: parsed.tags.length > 0 ? parsed.tags : ['工具库']
          };
          
          // 添加到 bookmarks 数组开头
          bookmarksData.bookmarks.unshift(newBookmark);
          
          // 写回文件（保持格式化）
          fs.writeFileSync(
            bookmarksPath,
            JSON.stringify(bookmarksData, null, 4) + '\n',
            'utf8'
          );
          
          console.log('✅ 成功添加新工具:', parsed.toolName);
          console.log('📝 工具信息:', JSON.stringify(newBookmark, null, 2));
          
          // 输出到 GitHub Actions
          const output = `tool_name=${parsed.toolName}\ntool_url=${parsed.githubUrl}`;
          fs.writeFileSync(process.env.GITHUB_OUTPUT, output, { flag: 'a' });
          SCRIPT_END
          
          # 运行解析脚本
          ISSUE_BODY="$ISSUE_BODY" node parse-issue.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
      
      - name: Commit changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add src/data/bookmarks.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🤖 自动收录: ${{ steps.parse-issue.outputs.tool_name }}
            
            - 工具名称: ${{ steps.parse-issue.outputs.tool_name }}
            - GitHub: ${{ steps.parse-issue.outputs.tool_url }}
            - 来源 Issue: #${{ github.event.issue.number }}
            
            由 GitHub Actions 自动处理"
            
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on Issue
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🎉 **收录成功！**
              
              您提交的工具 **${{ steps.parse-issue.outputs.tool_name }}** 已成功添加到工具库中！
              
              - 📦 工具名称: ${{ steps.parse-issue.outputs.tool_name }}
              - 🔗 GitHub 地址: ${{ steps.parse-issue.outputs.tool_url }}
              
              感谢您为前端社区做出的贡献！🙏
              
              工具将在下次部署后出现在网站上。`
            });
            
            // 关闭 Issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            
            // 添加 "已收录" 标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['已收录']
            });
      
      - name: Comment on Issue (No Changes)
        if: steps.commit.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **该工具已存在**
              
              工具 **${{ steps.parse-issue.outputs.tool_name }}** 已经在工具库中了，无需重复添加。
              
              如需更新工具信息，请提交新的 Issue 或直接修改 \`src/data/bookmarks.json\` 文件。`
            });
