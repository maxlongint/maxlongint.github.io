name: 🤖 Auto Merge Submission

on:
    issues:
        types: [labeled]
    workflow_dispatch:
        inputs:
            issue_number:
                description: 'Issue number to process'
                required: true
                type: number

jobs:
    merge-submission:
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == '收录通过')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Get Issue Body
              id: get-issue
              run: |
                  ISSUE_NUM=${{ github.event.inputs.issue_number || github.event.issue.number }}
                  ISSUE_BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUM}" | \
                    jq -r '.body')
                  echo "body<<EOF" >> $GITHUB_OUTPUT
                  echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Parse Issue and Update Bookmarks
              id: parse-issue
              env:
                  ISSUE_BODY: ${{ steps.get-issue.outputs.body }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/parse-and-merge-issue.cjs

            - name: Generate OG Image for New Tool
              if: steps.parse-issue.outputs.already_exists == 'false'
              run: |
                  npm run generate-og-single "${{ steps.parse-issue.outputs.tool_url }}"

            - name: Generate Comparison Data for New Tool
              if: steps.parse-issue.outputs.already_exists == 'false'
              run: |
                  npm run update-comparison-single "${{ steps.parse-issue.outputs.tool_url }}"

            - name: Generate Compatibility Data for New Tool
              if: steps.parse-issue.outputs.already_exists == 'false'
              run: |
                  npm run update-compatibility-single "${{ steps.parse-issue.outputs.tool_url }}"

            - name: Commit All Changes
              if: steps.parse-issue.outputs.already_exists == 'false'
              id: commit
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  # 添加所有修改的文件
                  git add src/data/bookmarks.json
                  git add src/data/og-images/
                              
                  # 如果有同步数据，也一起提交
                  if [ -f "src/data/github-stats.json" ]; then
                    git add src/data/github-stats.json
                  fi
                  if [ -f "src/data/github-readmes.json" ]; then
                    git add src/data/github-readmes.json
                  fi
                  if [ -f "src/data/comparison-data.json" ]; then
                    git add src/data/comparison-data.json
                  fi
                  if [ -f "src/data/compatibility-data.json" ]; then
                    git add src/data/compatibility-data.json
                  fi

                  ISSUE_NUM=${{ github.event.inputs.issue_number || github.event.issue.number }}
                  COMMIT_MSG="Add tool: ${{ steps.parse-issue.outputs.tool_name }} (Issue #${ISSUE_NUM})"
                  if [ "${{ steps.parse-issue.outputs.tags_updated }}" = "true" ]; then
                    COMMIT_MSG="${COMMIT_MSG}\n\n- Auto-generated new tag styles"
                  fi
                  if [ "${{ steps.parse-issue.outputs.stats_data_added }}" = "true" ]; then
                    COMMIT_MSG="${COMMIT_MSG}\n- Added GitHub stats data"
                  fi
                  if [ "${{ steps.parse-issue.outputs.readme_data_added }}" = "true" ]; then
                    COMMIT_MSG="${COMMIT_MSG}\n- Added README data"
                  fi
                  COMMIT_MSG="${COMMIT_MSG}\n- Generated OG image"
                  COMMIT_MSG="${COMMIT_MSG}\n- Generated comparison data"
                  COMMIT_MSG="${COMMIT_MSG}\n- Generated compatibility data"

                  git commit -m "${COMMIT_MSG}"
                  git push

            - name: Trigger Deployment
              if: steps.parse-issue.outputs.already_exists == 'false'
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  event-type: deploy-requested
                  client-payload: '{"reason": "New tool added: ${{ steps.parse-issue.outputs.tool_name }}"}'

            - name: Comment and Close Issue
              if: steps.parse-issue.outputs.already_exists == 'false'
              uses: actions/github-script@v7
              with:
                  script: |
                      const handleSuccess = require('./scripts/handle-merge-success.cjs');
                      const issueNumber = ${{ github.event.inputs.issue_number || github.event.issue.number }};
                      await handleSuccess({ github, context, issueNumber });

            - name: Cleanup on Failure
              if: failure() && steps.parse-issue.outputs.already_exists == 'false'
              uses: actions/github-script@v7
              with:
                  script: |
                      const handleFailure = require('./scripts/handle-merge-failure.cjs');
                      const issueNumber = ${{ github.event.inputs.issue_number || github.event.issue.number }};
                      const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
                      await handleFailure({ github, context, issueNumber, runUrl });
