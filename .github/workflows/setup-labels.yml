name: 🏷️ Setup Repository Labels

on:
    workflow_dispatch: # 手动触发

jobs:
    setup-labels:
        runs-on: ubuntu-latest
        permissions:
            issues: write

        steps:
            - name: Create or Update Labels
              uses: actions/github-script@v7
              with:
                  script: |
                      const labels = [
                        {
                          name: '待审核',
                          color: 'FFA500',
                          description: '等待人工审核的收录申请'
                        },
                        {
                          name: '收录通过',
                          color: '2EA44F',
                          description: '审核通过，将自动收录（仅用于触发）'
                        },
                        {
                          name: '已收录',
                          color: '8B5CF6',
                          description: '已成功收录到工具库'
                        },
                        {
                          name: '需要修改',
                          color: 'D4A72C',
                          description: '需要修改后重新提交'
                        },
                        {
                          name: '拒绝收录',
                          color: 'D73A4A',
                          description: '不符合收录标准'
                        },
                        {
                          name: '重复收录',
                          color: 'E99695',
                          description: '工具已存在于收录列表中'
                        },
                        {
                          name: '收录失败',
                          color: 'F85149',
                          description: '自动收录过程中出现错误'
                        }
                      ];

                      for (const label of labels) {
                        try {
                          // 尝试获取标签
                          await github.rest.issues.getLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: label.name
                          });
                          
                          // 如果存在，更新标签
                          await github.rest.issues.updateLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: label.name,
                            color: label.color,
                            description: label.description
                          });
                          
                          console.log(`✅ 更新标签: ${label.name}`);
                        } catch (error) {
                          // 如果不存在，创建标签
                          if (error.status === 404) {
                            await github.rest.issues.createLabel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: label.name,
                              color: label.color,
                              description: label.description
                            });
                            
                            console.log(`✨ 创建标签: ${label.name}`);
                          } else {
                            throw error;
                          }
                        }
                      }

                      console.log('🎉 标签设置完成！');
