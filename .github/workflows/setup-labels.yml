name: Setup Repository Labels

on:
    workflow_dispatch: # 手动触发
    push:
        branches:
            - main
        paths:
            - '.github/workflows/setup-labels.yml'

jobs:
    setup-labels:
        runs-on: ubuntu-latest
        permissions:
            issues: write

        steps:
            - name: Create or Update Labels
              uses: actions/github-script@v7
              with:
                  script: |
                      const labels = [
                        {
                          name: '收录申请',
                          color: '0E8A16',
                          description: '新工具收录申请'
                        },
                        {
                          name: '待审核',
                          color: 'FBCA04',
                          description: '等待审核的收录申请'
                        },
                        {
                          name: '收录通过',
                          color: '0E8A16',
                          description: '审核通过，将自动收录'
                        },
                        {
                          name: 'approved',
                          color: '0E8A16',
                          description: 'Approved for inclusion'
                        },
                        {
                          name: '已收录',
                          color: '5319E7',
                          description: '已成功收录到工具库'
                        },
                        {
                          name: '需要修改',
                          color: 'D93F0B',
                          description: '需要修改后重新提交'
                        },
                        {
                          name: '拒绝收录',
                          color: 'B60205',
                          description: '不符合收录标准'
                        }
                      ];

                      for (const label of labels) {
                        try {
                          // 尝试获取标签
                          await github.rest.issues.getLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: label.name
                          });
                          
                          // 如果存在，更新标签
                          await github.rest.issues.updateLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            name: label.name,
                            color: label.color,
                            description: label.description
                          });
                          
                          console.log(`✅ 更新标签: ${label.name}`);
                        } catch (error) {
                          // 如果不存在，创建标签
                          if (error.status === 404) {
                            await github.rest.issues.createLabel({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: label.name,
                              color: label.color,
                              description: label.description
                            });
                            
                            console.log(`✨ 创建标签: ${label.name}`);
                          } else {
                            throw error;
                          }
                        }
                      }

                      console.log('🎉 标签设置完成！');
