name: 📝 Generate Appreciates

on:
    workflow_dispatch:
        inputs:
            mode:
                description: '生成模式'
                required: true
                default: 'missing'
                type: choice
                options:
                    - missing  # 仅生成缺失的报告
                    - all      # 生成所有报告
                    - single   # 生成单个项目
            library_title:
                description: '项目名称（仅 single 模式，例如：Axios）'
                required: false
                default: ''
            delay:
                description: 'API 请求延迟（毫秒）'
                required: false
                default: '3000'

jobs:
    generate-appreciates:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: List missing appreciates
              run: node scripts/generate-appreciates-deepseek.js --list-missing

            - name: Generate appreciates (missing mode)
              if: github.event.inputs.mode == 'missing'
              env:
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
              run: node scripts/generate-appreciates-deepseek.js --missing --delay ${{ github.event.inputs.delay }}

            - name: Generate appreciates (all mode)
              if: github.event.inputs.mode == 'all'
              env:
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
              run: node scripts/generate-appreciates-deepseek.js --all --delay ${{ github.event.inputs.delay }}

            - name: Generate appreciates (single mode)
              if: github.event.inputs.mode == 'single'
              env:
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
              run: node scripts/generate-appreciates-deepseek.js --library "${{ github.event.inputs.library_title }}" --delay ${{ github.event.inputs.delay }}

            - name: Check for changes
              id: check_changes
              run: |
                  if [ -n "$(git status --porcelain public/appreciates/)" ]; then
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                    echo "✅ 检测到新的鉴赏报告"
                  else
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                    echo "ℹ️  没有新的鉴赏报告生成"
                  fi

            - name: Commit and push changes
              if: steps.check_changes.outputs.has_changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add public/appreciates/
                  git commit -m "📝 Generate appreciates reports"
                  git push

            - name: Trigger deployment
              if: steps.check_changes.outputs.has_changes == 'true'
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  event-type: deploy-requested

            - name: Summary
              if: always()
              run: |
                  echo "## 📊 生成鉴赏报告任务完成" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- **模式**: ${{ github.event.inputs.mode }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **延迟**: ${{ github.event.inputs.delay }}ms" >> $GITHUB_STEP_SUMMARY
                  if [ "${{ github.event.inputs.mode }}" == "single" ]; then
                    echo "- **项目**: ${{ github.event.inputs.library_title }}" >> $GITHUB_STEP_SUMMARY
                  fi
                  echo "- **有变更**: ${{ steps.check_changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
