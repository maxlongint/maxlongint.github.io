name: Auto Label Submission

on:
    issues:
        types: [opened]

jobs:
    auto-label:
        runs-on: ubuntu-latest
        permissions:
            issues: write

        steps:
            - name: Add labels to submission
              uses: actions/github-script@v7
              with:
                  script: |
                      const issue = context.payload.issue;
                      
                      // 检查 Issue 标题是否包含 [收录]
                      if (issue.title.includes('[收录]')) {
                        await github.rest.issues.addLabels({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issue.number,
                          labels: ['收录申请', '待审核']
                        });
                        
                        console.log(`✅ 已为 Issue #${issue.number} 添加标签`);
                        
                        // 添加欢迎评论
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issue.number,
                          body: `👋 感谢提交新工具!

您的提交已收到,管理员会尽快审核。

**审核流程:**
- ⏳ 当前状态: 待审核
- ✅ 审核通过后会自动添加到工具库
- 📧 您会收到通知

如有问题,请在评论中说明。`
                        });
                      }
