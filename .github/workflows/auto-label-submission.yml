name: 🏷️ Auto Label New Submissions

on:
    issues:
        types: [opened]

jobs:
    auto-label:
        runs-on: ubuntu-latest
        permissions:
            issues: write

        steps:
            - name: Checkout repository
              if: contains(github.event.issue.title, '[收录]')
              uses: actions/checkout@v4

            - name: Setup Node.js
              if: contains(github.event.issue.title, '[收录]')
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Check for duplicate submission
              if: contains(github.event.issue.title, '[收录]')
              id: check-duplicate
              env:
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: |
                  # 运行检查脚本并捕获输出
                  result=$(node -e "
                    const {checkDuplicateSubmission} = require('./scripts/check-duplicate-submission.cjs');
                    const result = checkDuplicateSubmission(process.env.ISSUE_BODY);
                    console.log(JSON.stringify(result));
                  ")

                  echo "检查结果: $result"

                  # 解析结果
                  is_duplicate=$(echo "$result" | node -e "const data = JSON.parse(require('fs').readFileSync(0, 'utf-8')); console.log(data.isDuplicate);")
                  existing_title=$(echo "$result" | node -e "const data = JSON.parse(require('fs').readFileSync(0, 'utf-8')); console.log(data.existingTitle);")

                  echo "is_duplicate=$is_duplicate" >> $GITHUB_OUTPUT
                  echo "existing_title=$existing_title" >> $GITHUB_OUTPUT

            - name: Handle duplicate submission
              if: steps.check-duplicate.outputs.is_duplicate == 'true'
              uses: actions/github-script@v7
              with:
                  script: |
                      const handleDuplicate = require('./scripts/handle-duplicate-submission.cjs');
                      await handleDuplicate({
                        github,
                        context,
                        existingTitle: '${{ steps.check-duplicate.outputs.existing_title }}'
                      });

            - name: Handle new submission
              if: contains(github.event.issue.title, '[收录]') && steps.check-duplicate.outputs.is_duplicate != 'true'
              uses: actions/github-script@v7
              with:
                  script: |
                      const handleNew = require('./scripts/handle-new-submission.cjs');
                      await handleNew({ github, context });
