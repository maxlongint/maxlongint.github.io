name: 🔄 Update Single Library Comparison

on:
    workflow_dispatch:
        inputs:
            github_url:
                description: 'GitHub 仓库 URL (例如: https://github.com/tailwindlabs/tailwindcss)'
                required: true
                type: string

jobs:
    update-single:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: master

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Update comparison data for single library
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  npm run update-comparison-single "${{ github.event.inputs.github_url }}"

            - name: Check for changes
              id: check_changes
              run: |
                  if git diff --quiet src/data/comparison-data.json; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                  else
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.check_changes.outputs.has_changes == 'true'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add src/data/comparison-data.json
                  git commit -m "chore: update comparison data for ${{ github.event.inputs.github_url }}"
                  git push

            - name: No changes detected
              if: steps.check_changes.outputs.has_changes == 'false'
              run: |
                  echo "ℹ️ No changes detected in comparison data"
